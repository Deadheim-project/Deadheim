## Distance in pixels from the right edge of the screen to the journal button. It sits on the right because the left is where other mods stack their bars.
# Setting type: Single
# Default value: 24
JournalButtonX = 24

## Distance in pixels from the top edge of the screen to the journal button. Raise it to clear another mod's bar.
# Setting type: Single
# Default value: 260
JournalButtonY = 260

[Teleporter]

## Prefab name of the item charged per teleport (empty = free)
# Setting type: String
# Default value: 
CostItem = 

## How many of CostItem are consumed per teleport
# Setting type: Int32
# Default value: 0
CostAmount = 0

## Seconds a player must wait between uses of the same teleporter
# Setting type: Single
# Default value: 0
CooldownSeconds = 0

[Teste]

## Liga o mundo de teste: skills no maximo, moedas ao nascer, plataformas no ceu (spawn, arena e castelo) e mercadores vendendo todos os itens do jogo por 1 moeda. NUNCA ligue num servidor aberto ao publico.
# Setting type: Boolean
# Default value: false
Enabled = false

## Nivel em que todas as skills ficam ao nascer (0 = nao mexe nas skills).
# Setting type: Int32
# Default value: 100
SkillLevel = 100

## Ao nascer, o jogador fica com pelo menos estas moedas no inventario (0 = nao da moedas).
# Setting type: Int32
# Default value: 10000
StartCoins = 10000

## Todo nascimento (entrar no mundo e renascer) acontece na plataforma de spawn.
# Setting type: Boolean
# Default value: true
SpawnOnHub = true

## x,y,z do centro da plataforma de spawn. A arena fica a leste e o castelo a oeste, a PlatformDistance dela.
# Setting type: String
# Default value: 0,800,0
Origin = 0,800,0

## Distancia em metros da plataforma de spawn ate a arena e ate o castelo. Longe o bastante para sair da zona segura do templo inicial (StartIslandRadius do Deadheim).
# Setting type: Single
# Default value: 3008
PlatformDistance = 3008

## Aumente para o servidor apagar as plataformas e NPCs de teste e construir tudo de novo.
# Setting type: Int32
# Default value: 1
BuildVersion = 1

[Trainer]

## Estudo: XP de skill a mais enquanto dura (0.5 = +50%). Multiplica o ganho que ja passou pelo SkillMultiplier do Deadheim e pelo de PvE/PvP: com SkillMultiplier 0.5 o ganho vai a 0.75 do vanilla. 0 desliga a venda.
# Setting type: Single
# Default value: 0.5
StudyBonus = 0.5

## Estudo: minutos de jogo que dura (so corre com o jogo aberto). Comprar com um ativo soma o tempo.
# Setting type: Int32
# Default value: 60
StudyMinutes = 60

## Estudo: so vale nas skills abaixo deste nivel.
# Setting type: Int32
# Default value: 50
StudyMaxSkill = 50

## Protecao: fracao da perda de skill que ela corta na proxima morte em que vale (0.5 = metade). 0 desliga a venda. A pena de PK nunca e reduzida, e morte que nao tira skill (arena, castelo) nao gasta a protecao.
# Setting type: Single
# Default value: 0.5
ProtectionFactor = 0.5

## Protecao: so em morte PvE (monstro, queda, afogamento). Desligado, vale tambem em morte para jogador sem PK.
# Setting type: Boolean
# Default value: true
ProtectionPveOnly = true

## Aula: ate que nivel o Treinador ensina, pelo passe de chefe do jogador (o do Mestre dos Passes): <boss>:<nivel> separados por |, e none:<nivel> para quem nao tem passe nenhum. Vale o maior a que o jogador tem direito. Sem none, quem nao tem passe nao tem aula.
# Setting type: String
# Default value: none:15|gd_king:25|Bonemass:35|Dragon:45|GoblinKing:50
LessonCaps = none:15|gd_king:25|Bonemass:35|Dragon:45|GoblinKing:50

## Aula: teto absoluto. Nenhum passe faz a aula passar deste nivel.
# Setting type: Int32
# Default value: 50
LessonMaxLevel = 50

## Aula: quantas por personagem por semana (segunda a domingo, relogio do servidor). 0 = sem limite. As aulas dadas ficam em treinador.txt, na pasta do mod ao lado do bosspass.txt.
# Setting type: Int32
# Default value: 5
LessonsPerWeek = 5

## Precos: item=study ou item=protection, e item=lesson;levels=<de>-<ate> por faixa de nivel alvo (o nivel depois da aula), cada um com gold=<Coins>;deadcoins=<Deadcoins>, entradas separadas por |. Preco 0 = nao vende naquela moeda. Deadcoins saem do saldo do servidor; Coins ficam na bolsa do jogador e o cliente paga depois de receber, como no Mestre das Montarias (um cliente modificado pode nao pagar).
